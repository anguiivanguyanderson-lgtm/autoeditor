<svg width="512" height="512" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24242b"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.05" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4c5cb"/>
    </linearGradient>
    <linearGradient id="silverBright" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7e8ec"/>
    </linearGradient>
  </defs>

  <!-- app-icon squircle -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#sheen)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="29.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- back frame, offset behind — the "stack of clips" nod (same family as Flow Automator) -->
  <rect x="28" y="26" width="52" height="52" rx="11" fill="none"
        stroke="url(#silver)" stroke-opacity="0.4" stroke-width="4"/>

  <!-- front clip tile -->
  <rect x="46" y="44" width="58" height="58" rx="13" fill="url(#silver)"/>
  <!-- play glyph cut into the tile: the "video / editor" mark -->
  <path d="M68 58 L88 73 L68 88 Z" fill="#15151a"/>

  <!-- timeline scrubber under the tile: track + amber playhead (AutoEditor's "now") -->
  <rect x="30" y="110" width="68" height="4" rx="2" fill="url(#silver)" fill-opacity="0.35"/>
  <circle cx="58" cy="112" r="5" fill="#f5a623"/>

  <!-- ✦ spark — the TryAIToday brand accent -->
  <path d="M99 24 L101.3 30.8 L108 33 L101.3 35.2 L99 42 L96.7 35.2 L90 33 L96.7 30.8 Z"
        fill="url(#silverBright)"/>
</svg>
